jdk:
  - openjdk17

before_install:
  - curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz -o /tmp/node.tar.xz
  - tar -xJf /tmp/node.tar.xz -C /tmp

install:
  - export PATH=/tmp/node-v22.14.0-linux-x64/bin:$PATH && npm install --global pnpm@10 && ./gradlew publishToMavenLocal
