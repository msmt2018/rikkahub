jdk:
  - openjdk17

before_install:
  - git submodule sync --recursive
  - git submodule update --init --recursive
  - curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz -o /tmp/node.tar.xz
  - tar -xJf /tmp/node.tar.xz -C /tmp

install:
  - export PATH="$HOME/.local/bin:/tmp/node-v22.14.0-linux-x64/bin:$PATH" && npm install --global --prefix "$HOME/.local" pnpm@11 && cd web-ui && pnpm install --frozen-lockfile && cd .. && chmod +x gradlew && ./gradlew :app:assembleRelease :ai:publishReleasePublicationToMavenLocal :common:publishReleasePublicationToMavenLocal :document:publishReleasePublicationToMavenLocal :highlight:publishReleasePublicationToMavenLocal :search:publishReleasePublicationToMavenLocal :speech:publishReleasePublicationToMavenLocal :web:publishReleasePublicationToMavenLocal :material3:publishReleasePublicationToMavenLocal :ui:publishReleasePublicationToMavenLocal :workspace:publishReleasePublicationToMavenLocal :terminal:publishReleasePublicationToMavenLocal :mediagen:publishReleasePublicationToMavenLocal :oauth:publishReleasePublicationToMavenLocal -x test
