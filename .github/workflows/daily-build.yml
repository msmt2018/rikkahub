name: RikkaHub Library Build

on:
  push:
    branches:
      - ZeroStudio-library-migration
      - ZeroStudio
  workflow_dispatch:
  schedule:
    - cron: '0 9,18 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build app library and publish reusable modules locally
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:assembleRelease \
            :ai:publishReleasePublicationToMavenLocal \
            :common:publishReleasePublicationToMavenLocal \
            :document:publishReleasePublicationToMavenLocal \
            :highlight:publishReleasePublicationToMavenLocal \
            :search:publishReleasePublicationToMavenLocal \
            :speech:publishReleasePublicationToMavenLocal \
            :web:publishReleasePublicationToMavenLocal \
            :material3:publishReleasePublicationToMavenLocal \
            :ui:publishReleasePublicationToMavenLocal \
            :workspace:publishReleasePublicationToMavenLocal \
            :terminal:publishReleasePublicationToMavenLocal \
            :mediagen:publishReleasePublicationToMavenLocal \
            :oauth:publishReleasePublicationToMavenLocal

      - name: Upload AAR and Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-library-artifacts
          if-no-files-found: error
          path: |
            **/build/outputs/aar/*.aar
            ~/.m2/repository/com/github/msmt2018/rikkahub/
