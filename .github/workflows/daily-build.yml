name: RikkaHub Library Build

on:
  push:
    branches:
      - ZeroStudio
      - ZeroStudio-library-migration
  workflow_dispatch:
  schedule:
    - cron: '0 9,18 * * *'

concurrency:
  group: rikkahub-library-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build app library and publish reusable modules locally
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:assembleRelease \
            :ai:publishReleasePublicationToMavenLocal \
            :common:publishReleasePublicationToMavenLocal \
            :document:publishReleasePublicationToMavenLocal \
            :highlight:publishReleasePublicationToMavenLocal \
            :search:publishReleasePublicationToMavenLocal \
            :speech:publishReleasePublicationToMavenLocal \
            :web:publishReleasePublicationToMavenLocal \
            :material3:publishReleasePublicationToMavenLocal \
            :ui:publishReleasePublicationToMavenLocal \
            :workspace:publishReleasePublicationToMavenLocal \
            :terminal:publishReleasePublicationToMavenLocal \
            :mediagen:publishReleasePublicationToMavenLocal \
            :oauth:publishReleasePublicationToMavenLocal

      - name: Upload AAR and Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-library-artifacts
          if-no-files-found: error
          path: |
            **/build/outputs/aar/*.aar
            ~/.m2/repository/com/github/msmt2018/rikkahub/

      - name: Trigger and verify JitPack branch snapshot
        env:
          JITPACK_POM_URL: https://jitpack.io/com/github/msmt2018/rikkahub/ai/ZeroStudio-SNAPSHOT/ai-ZeroStudio-SNAPSHOT.pom
        run: |
          POM="$RUNNER_TEMP/rikkahub-ai.pom"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 20 \
              "$JITPACK_POM_URL" --output "$POM" \
              && grep -q '<artifactId>ai</artifactId>' "$POM"; then
              echo "JitPack published the ai module for ZeroStudio-SNAPSHOT."
              exit 0
            fi
            echo "JitPack build is not ready (attempt $attempt/30)."
            sleep 20
          done
          cat "$POM" || true
          exit 1
